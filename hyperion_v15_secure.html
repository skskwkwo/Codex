const API_URL = 'http://localhost:11434';
let v15Model = 'llama3';
let v15Lock = false;
let watchdogTimer = null;
const inputV15 = document.getElementById('omni-input-v15');
const scrollerV15 = document.getElementById('chat-quantum-scroller');
const btnV15 = document.getElementById('v15-ignite-btn');
const maskV15 = document.getElementById('v15-mask');
const logV15 = document.getElementById('v15-log-terminal');

marked.setOptions({mangle:false,headerIds:false});

function writeV15Log(msg){ const now=new Date().toLocaleTimeString(); logV15.innerHTML += `[${now}] ${escapeHTML(msg)}<br>`; logV15.scrollTop=logV15.scrollHeight; }
function escapeHTML(str){ return String(str).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function sanitizeHTML(unsafeHTML){
  const parser = new DOMParser();
  const doc = parser.parseFromString(unsafeHTML, 'text/html');
  doc.querySelectorAll('script, iframe, object, embed, link, style, form').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const n = attr.name.toLowerCase();
      const v = attr.value || '';
      if (n.startsWith('on')) el.removeAttribute(attr.name);
      if ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(v)) el.removeAttribute(attr.name);
      if (n === 'target') el.setAttribute('rel', 'noopener noreferrer');
    });
  });
  return doc.body.innerHTML;
}

function forceUnlockV15(){ clearTimeout(watchdogTimer); v15Lock=false; maskV15.style.display='none'; btnV15.disabled=false; }
async function runPulseV15(){
  try{ const c=new AbortController(); setTimeout(()=>c.abort(),2000); const res=await fetch(`${API_URL}/api/tags`,{signal:c.signal,method:'GET'}); if(!res.ok) throw new Error('OFFLINE');
    document.getElementById('server-led-v15').classList.add('led-ready-cyan'); document.getElementById('server-status-text').innerText='CONNECTED'; return true;
  }catch(e){ document.getElementById('server-led-v15').classList.remove('led-ready-cyan'); document.getElementById('server-status-text').innerText='OFFLINE'; return false; }
}
function switchV15Model(target){ v15Model=target; document.getElementById('active-model').innerText=target; writeV15Log(`SYS: ROUTING_TO_${target.toUpperCase()}`); }
function renderV15Packet(role,text){
  const packet=document.createElement('div'); packet.className=`packet-${role}`;
  if(role==='user'){ const b=document.createElement('div'); b.className='bubble-flux-v15'; b.textContent=text; packet.appendChild(b); }
  else { const b=document.createElement('div'); b.className='bubble-flux-v15'; b.innerHTML='<div style="opacity:.5">STREAMING_DATA...</div>'; packet.appendChild(b); }
  scrollerV15.appendChild(packet); scrollerV15.scrollTop=scrollerV15.scrollHeight; return packet;
}
async function igniteNeuralV15(){
  const prompt=inputV15.value.trim(); if(!prompt||v15Lock) return;
  if(prompt.length>8000){ alert('입력 길이 제한(8000자)을 초과했습니다.'); return; }
  const online=await runPulseV15(); if(!online){ alert('Ollama 서버 오프라인. 11434 포트를 확인하십시오.'); return; }
  v15Lock=true; maskV15.style.display='block'; btnV15.disabled=true; watchdogTimer=setTimeout(forceUnlockV15,30000);
  renderV15Packet('user',prompt); const aiPacket=renderV15Packet('ai',''); const bubble=aiPacket.querySelector('.bubble-flux-v15');
  let accumulatedData=''; const requestStarted=Date.now(); metrics.requests += 1; refreshMetrics();
  try{
    const controller = new AbortController(); const timeout = setTimeout(()=>controller.abort(), 45000);
    const response=await fetch(`${API_URL}/api/generate`,{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({model:v15Model,prompt,stream:true,options:{temperature:0.5,num_ctx:16384,num_thread:16,top_p:0.9,repeat_penalty:1.15}})});
    clearTimeout(timeout); if(!response.ok||!response.body) throw new Error('NETWORK_FAILURE');
    const reader=response.body.getReader(); const decoder=new TextDecoder();
    while(true){ const {done,value}=await reader.read(); if(done) break; const lines=decoder.decode(value,{stream:true}).split('\n');
      for(const line of lines){ if(!line.trim()) continue; try{ const json=JSON.parse(line); if(json.response){ accumulatedData += json.response; const rendered = marked.parse(accumulatedData); bubble.innerHTML = sanitizeHTML(rendered); bubble.querySelectorAll('pre code').forEach(c=>hljs.highlightElement(c)); scrollerV15.scrollTop=scrollerV15.scrollHeight; } }catch(_){}}
    }
  }catch(err){ bubble.innerHTML=`<span style="color:#ff003c;">[NEURAL_FAULT_V15] 연결 실패 또는 시간초과: ${escapeHTML(err.message)}</span>`; writeV15Log(`ERR: ${err.message}`); }
  finally{ const elapsed=Date.now()-requestStarted; metrics.totalLatency += elapsed; metrics.totalTokens += estimateTokensKR(accumulatedData); if(accumulatedData){metrics.success +=1;} else {metrics.fail +=1;} refreshMetrics(); forceUnlockV15(); inputV15.value=''; inputV15.focus(); }
}
inputV15.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); igniteNeuralV15(); }});

const metrics={requests:0,success:0,fail:0,totalLatency:0,totalTokens:0};
const metricEls={
  requests:document.getElementById('metric-requests'),
  success:document.getElementById('metric-success'),
  fail:document.getElementById('metric-fail'),
  avgLatency:document.getElementById('metric-avg-latency'),
  estTokens:document.getElementById('metric-est-tokens')
};
function refreshMetrics(){
  metricEls.requests.textContent=String(metrics.requests);
  metricEls.success.textContent=String(metrics.success);
  metricEls.fail.textContent=String(metrics.fail);
  metricEls.avgLatency.textContent=metrics.requests?String(Math.round(metrics.totalLatency/metrics.requests)): '0';
  metricEls.estTokens.textContent=String(metrics.totalTokens);
}
function estimateTokensKR(text){ return Math.max(1, Math.round((text||'').length/2.8)); }

function exportChat(){
  const packets=[...document.querySelectorAll('#chat-quantum-scroller > div')].map((el,i)=>`#${i+1}\n${el.innerText.trim()}`).join('\n\n');
  const payload={exportedAt:new Date().toISOString(),model:v15Model,content:packets};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`hyperion_v15_chat_${Date.now()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  writeV15Log('INF: CHAT_EXPORTED_JSON');
}

  scrollerV15.innerHTML='';

function insertTemplate(){
  const template=document.getElementById('quick-template').value.trim();

  inputV15.value=(inputV15.value?inputV15.value+'\n':'')+template;
  inputV15.focus();
}

function expandedFindTemplates(query){ const q=(query||"" ).toLowerCase().trim(); if(!q){ return EXPANDED_TEMPLATE_REGISTRY.slice(0,30);} return EXPANDED_TEMPLATE_REGISTRY.filter(x=>x.name.toLowerCase().includes(q)||x.value.toLowerCase().includes(q)).slice(0,30); }
function expandedApplyFirstTemplate(){ const matched=expandedFindTemplates(document.getElementById("quick-template").value); if(!matched.length){ writeV15Log("INF: TEMPLATE_NOT_FOUND"); return; } const picked=matched[0]; const t=document.getElementById("omni-input-v15"); t.value=(t.value?t.value+"\n":"")+picked.value; t.focus(); writeV15Log(`INF: TEMPLATE_APPLIED_${picked.id}`); }
document.getElementById("quick-template").addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); expandedApplyFirstTemplate(); }});
document.getElementById("quick-template").addEventListener("input", ()=>{ const n=expandedFindTemplates(document.getElementById("quick-template").value).length; writeV15Log(`INF: TEMPLATE_MATCH_COUNT_${n}`); });
